<!doctype html>
<html><head><meta charset="utf-8">
<title>PROTOTYPE: Grouply settings window</title>
<!--
  PROTOTYPE, throwaway. Question: what should a Grouply settings window with live previews look like?
  Three structurally different variants of one window, switchable with ?variant=A|B|C, the bottom bar,
  or the left/right arrow keys. All variants share one settings state, so values carry across.
  The settings.toml the window would write is shown under it and updates live.
  The tab preview reproduces layout::layout_tabs, layout::bar_rect and tabbar::draw at 96 DPI;
  limits come from settings::parse.

  Verdict (2026-10-28): C, presets and dials. The user found it the cleanest. Open points for the real
  window: where the seven bar sizes without a dial live, and keyboard/typed input on the dials.
-->
<style>
body { margin: 0; padding-bottom: 64px; font: 13px var(--font-sans, "Segoe UI", system-ui, sans-serif); }
.standalone body { background: #111; color: #e8e8e8; max-width: 728px; margin: 24px auto; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
.muted { color: var(--muted-foreground, #9a9a9a); }
.sp { flex: 1; }
.win { border: 1px solid var(--border, #333); border-radius: var(--radius, 10px); background: var(--card, #1b1b1b); padding: 16px; }
.wt { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.wt img { width: 20px; height: 20px; }
.wt b { font-size: 14px; }
h3 { font-size: 13px; font-weight: 600; margin: 18px 0 8px; }
.hint { margin: -4px 0 10px; color: var(--muted-foreground, #9a9a9a); }

/* Shared controls */
.row { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 6px; margin-bottom: 3px;
  background: color-mix(in srgb, var(--foreground, #fff) 4%, transparent); }
.lbl { flex: 1; min-width: 0; } .lbl b { display: block; font-weight: 500; } .lbl small { color: var(--muted-foreground, #9a9a9a); font-size: 12px; }
.val { font: 12px var(--font-mono, ui-monospace, monospace); min-width: 64px; text-align: right; color: var(--muted-foreground, #9a9a9a); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 180px; height: 4px; border-radius: 2px; margin: 0;
  background: linear-gradient(to right, #10B981 var(--p, 0%), color-mix(in srgb, var(--foreground, #fff) 18%, transparent) var(--p, 0%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #10B981; border: 3px solid var(--card, #1b1b1b); box-shadow: 0 0 0 1px #10B981; cursor: grab; }
input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #10B981; border: 3px solid var(--card, #1b1b1b); box-shadow: 0 0 0 1px #10B981; }
.dual { position: relative; width: 180px; height: 16px; }
.dual input { position: absolute; left: 0; top: 6px; width: 100%; pointer-events: none; background: transparent; }
.dual input::-webkit-slider-thumb { pointer-events: auto; }
.dual input::-moz-range-thumb { pointer-events: auto; }
.dual .trk { position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--foreground, #fff) 18%, transparent); }
.dual .fil { position: absolute; top: 6px; height: 4px; background: #10B981; }
.sw { width: 40px; height: 20px; border-radius: 10px; border: 1px solid var(--muted-foreground, #888); background: transparent; position: relative; cursor: pointer; flex: none; padding: 0; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted-foreground, #aaa); transition: left .12s; }
.sw[aria-checked=true] { background: #10B981; border-color: #10B981; }
.sw[aria-checked=true]::after { left: 23px; background: #fff; }
.seg { display: inline-flex; border: 1px solid var(--border, #333); border-radius: 6px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; font-size: 12px; }
.seg button + button { border-left: 1px solid var(--border, #333); }
.seg button[aria-pressed=true] { background: #10B981; color: #fff; }
.btn { border: 1px solid var(--border, #333); background: transparent; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn:hover { background: color-mix(in srgb, var(--foreground, #fff) 6%, transparent); }
.step { display: inline-flex; align-items: center; gap: 6px; }
.step button { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--border, #333); background: transparent; cursor: pointer; line-height: 1; padding: 0; }
.step b { font: 12px var(--font-mono, monospace); min-width: 30px; text-align: center; }

/* Preview scenes */
.pv { border: 1px solid var(--border, #333); border-radius: 8px; padding: 10px; }
.pvbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
.scene { position: relative; overflow: hidden; border-radius: 6px; font: 12px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
.scene + .scene { margin-top: 8px; }
.desk { position: absolute; inset: 0; }
.aw { position: absolute; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.25); }
.awt { height: 32px; display: flex; align-items: center; }
.ai { width: 16px; height: 16px; margin: 0 12px; display: inline-flex; flex: none; } .ai svg, .ti svg { width: 100%; height: 100%; }
.atl { white-space: nowrap; }
.caps { margin-left: auto; display: flex; } .caps span { width: 46px; height: 32px; display: grid; place-items: center; } .caps svg { width: 10px; height: 10px; }
.awm { height: 28px; display: flex; align-items: center; gap: 18px; padding-left: 14px; }
.awc { padding: 8px 14px; font: 13px/1.5 Consolas, ui-monospace, monospace; opacity: .8; }
.barpos { position: absolute; }
.bar { position: relative; }
.tb { position: absolute; overflow: hidden; }
.tb .stripe { position: absolute; top: 0; }
.ti { position: absolute; display: inline-flex; }
.tt { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
.tt span { overflow: hidden; text-overflow: ellipsis; }
.tx { position: absolute; display: grid; place-items: center; }
.full { position: absolute; z-index: 6; transition: transform .16s ease, opacity .16s; }
.full.hid { transform: translateY(-100%); opacity: 0; pointer-events: none; }
.scene:has(.zone:hover) .full.hid, .scene:has(.full.hid:hover) .full.hid { transform: none; opacity: 1; pointer-events: auto; }
.scene:has(.zone:hover) .rest, .scene:has(.full:hover) .rest { opacity: 0; }
.zone { position: absolute; left: 0; right: 0; top: 0; height: 8px; z-index: 5; }
.rest { position: absolute; z-index: 4; transition: opacity .12s; }
.rest b { position: absolute; top: 0; height: 5px; border-radius: 0 0 3px 3px; }
.cap { font-size: 11px; color: var(--muted-foreground, #9a9a9a); margin-top: 4px; }

/* Hold-to-group test */
.hold { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border, #333); background: transparent; border-radius: 99px; padding: 4px 12px 4px 6px; cursor: pointer; user-select: none; touch-action: none; }
.hold svg { width: 22px; height: 22px; transform: rotate(-90deg); }
.hold .trk2 { fill: none; stroke: color-mix(in srgb, var(--foreground, #fff) 18%, transparent); stroke-width: 3; }
.hold .arc { fill: none; stroke: #10B981; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 56.55; stroke-dashoffset: 56.55; }
.hold.ok { border-color: #10B981; }
.hold.early { border-color: #f59e0b; }

/* Variant A */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.grid2 .row { flex-wrap: wrap; gap: 6px 10px; padding: 8px 12px; margin: 0; }
.grid2 .row .lbl { flex-basis: 100%; }
.grid2 input[type=range] { flex: 1; width: auto; }
.grid2 .val { min-width: 44px; }
.foot { display: flex; gap: 8px; margin-top: 14px; }

/* Variant B */
.stage { position: relative; height: 225px; overflow: hidden; border-radius: 8px; border: 1px solid var(--border, #333); }
.stage-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; font: 12px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
.hd { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #10B981; border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.4); cursor: grab; z-index: 10; touch-action: none; }
.hd.ns { cursor: ns-resize; } .hd.ew { cursor: ew-resize; } .hd.nwse { cursor: nwse-resize; }
.hd .hl { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); white-space: nowrap; background: #0b0b0b; color: #fff;
  font: 11px var(--font-sans, system-ui); padding: 3px 7px; border-radius: 5px; opacity: 0; pointer-events: none; transition: opacity .1s; }
.hd:hover .hl, .hd.drag .hl { opacity: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.chip { border: 1px solid var(--border, #333); border-radius: 99px; padding: 3px 10px; font-size: 12px; }
.chip b { font-family: var(--font-mono, monospace); font-weight: 500; color: #10B981; margin-left: 4px; }
.others { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 14px; margin-top: 6px; }
.others > div { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.mp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mpc { border: 1px solid var(--border, #333); background: transparent; border-radius: 8px; padding: 6px; cursor: pointer; text-align: left; }
.mpc[aria-pressed=true] { border-color: #10B981; box-shadow: 0 0 0 1px #10B981; }
.mpc span { display: block; font-size: 12px; margin-top: 4px; }
.mini { position: relative; height: 34px; overflow: hidden; border-radius: 4px; }
.checks { display: flex; flex-direction: column; gap: 8px; }
.checks label { display: flex; align-items: center; gap: 10px; cursor: pointer; }

/* Variant C */
.presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pc { border: 1px solid var(--border, #333); background: transparent; border-radius: 8px; padding: 6px; cursor: pointer; text-align: left; }
.pc[aria-pressed=true] { border-color: #10B981; box-shadow: 0 0 0 1px #10B981; }
.pc .mini { height: 48px; }
.pc span { display: block; font-size: 12px; margin-top: 4px; }
.knobs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 2px; user-select: none; }
.kw { position: relative; width: 72px; height: 72px; cursor: ns-resize; touch-action: none; }
.kw svg { width: 100%; height: 100%; }
.kt { fill: none; stroke: color-mix(in srgb, var(--foreground, #fff) 14%, transparent); stroke-width: 6; stroke-linecap: round; }
.kv { fill: none; stroke: #10B981; stroke-width: 6; stroke-linecap: round; }
.kb { fill: color-mix(in srgb, var(--foreground, #fff) 7%, transparent); }
.kd { fill: var(--foreground, #fff); }
.kw b { position: absolute; inset: 0; display: grid; place-items: center; font: 600 13px var(--font-mono, monospace); }
.knob span { font-size: 12px; } .knob small { font-size: 11px; color: var(--muted-foreground, #9a9a9a); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tile { border: 1px solid var(--border, #333); background: transparent; border-radius: 8px; padding: 10px 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.tile[aria-checked=true] { border-color: #10B981; background: color-mix(in srgb, #10B981 12%, transparent); }
.tile i { font-style: normal; font-size: 11px; color: var(--muted-foreground, #9a9a9a); }
.tile[aria-checked=true] i { color: #10B981; }

/* Live settings.toml */
.toml { margin-top: 10px; border: 1px solid var(--border, #333); border-radius: var(--radius, 10px); background: var(--code-background, #151515); padding: 12px 16px; }
.toml-h { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 6px; }
.toml pre { margin: 0; font: 12px/1.55 var(--font-mono, ui-monospace, monospace); max-height: 230px; overflow: auto; }
.toml .c { color: var(--muted-foreground, #8a8a8a); }
.toml .chg { color: #10B981; }
.toml .chg::after { content: "  ← changed"; color: var(--muted-foreground, #8a8a8a); }
.flash { animation: flash .6s; } @keyframes flash { from { background: color-mix(in srgb, #10B981 25%, transparent); } }

/* Prototype switcher */
.switcher { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 4px;
  background: #fafafa; color: #111; border-radius: 99px; padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.5); font: 12px system-ui, sans-serif; }
.switcher button { border: 0; background: transparent; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 15px; color: #111; }
.switcher button:hover { background: #e5e5e5; }
.switcher span { padding: 0 8px; min-width: 190px; text-align: center; } .switcher span b { font-weight: 700; }
</style></head>
<body>
<div id="variants"></div>
<div class="toml" id="toml"><div class="toml-h"><b>settings.toml</b><span class="muted">what the window would write, as you change things</span></div><pre id="tomlText"></pre></div>
<div class="switcher"><button data-go="-1" aria-label="Previous variant">‹</button><span id="vlabel"></span><button data-go="1" aria-label="Next variant">›</button></div>
<script>
if (!getComputedStyle(document.documentElement).getPropertyValue('--background').trim()) document.documentElement.classList.add('standalone');

// ---- Settings state (defaults and limits from settings.rs) ----
const DEF = { hold: 350, middle: true, cycle: true, autostart: false, maximized: 'always',
  m: { height: 32, top_gap: 4, inset: 8, tab_min: 72, tab_max: 220, spacing: 2, padding: 8, icon: 16, close: 16, caption_reserve: 150, corner: 8 } };
const LIM = { height: [16, 96], top_gap: [0, 32], inset: [0, 64], tab_min: [32, 400], tab_max: [32, 800], spacing: [0, 16], padding: [0, 32],
  icon: [8, 64], close: [8, 64], caption_reserve: [0, 600], corner: [0, 32], hold: [0, 5000] };
const NAME = { height: 'Height', top_gap: 'Space above tabs', inset: 'Left inset', tab_min: 'Narrowest tab', tab_max: 'Widest tab', spacing: 'Gap between tabs',
  padding: 'Padding inside tabs', icon: 'Icon size', close: 'Close button', caption_reserve: 'Room for caption buttons', corner: 'Roundness', hold: 'Hold to group' };
const S = JSON.parse(JSON.stringify(DEF));
let theme = 'dark', nTabs = 3;
const get = k => k === 'hold' ? S.hold : S.m[k];
function setVal(k, v) {
  v = Math.round(v);
  const [lo, hi] = LIM[k];
  v = Math.min(Math.max(v, lo), hi);
  if (k === 'hold') S.hold = v; else S.m[k] = v;
  // settings::parse raises tab_max to tab_min; the UI also lets a lowered maximum push the minimum down.
  if (k === 'tab_min' && S.m.tab_max < v) S.m.tab_max = v;
  if (k === 'tab_max' && S.m.tab_min > v) S.m.tab_min = Math.max(v, LIM.tab_min[0]);
  render();
}

// ---- Tab bar model (ported from layout.rs and tabbar.rs) ----
const PAL = {
  light: { active: '#FFFFFF', inactive: '#E3E3E3', text: '#1A1A1A', accent: '#059669', glyph: '#444', title: '#F3F3F3', client: '#FFFFFF', ink: '#1A1A1A',
    menu: '#FAFAFA', line: '#E5E5E5', sliver: '#BDBDBD', desk: 'linear-gradient(135deg,#C9D8EE,#9DB6DE)' },
  dark: { active: '#3A3A3A', inactive: '#1F1F1F', text: '#F2F2F2', accent: '#10B981', glyph: '#CCC', title: '#202020', client: '#191919', ink: '#EDEDED',
    menu: '#232323', line: '#333', sliver: '#5C5C5C', desk: 'linear-gradient(135deg,#22324d,#0f1626)' } };
const IC = {
  notepad: '<svg viewBox="0 0 16 16"><rect x="3" y="1.5" width="10" height="13" rx="1.5" fill="#fff" stroke="#3B82F6"/><path d="M5.5 5h5M5.5 7.5h5M5.5 10h3" stroke="#3B82F6" stroke-linecap="round"/></svg>',
  folder: '<svg viewBox="0 0 16 16"><path d="M1.5 4a1 1 0 0 1 1-1h3.5l1.5 1.5h6a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" fill="#E9A92B"/><path d="M1.5 6h13v6a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" fill="#FFCF5C"/></svg>',
  term: '<svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="12" rx="2" fill="#2B2B2B" stroke="#555" stroke-width=".6"/><path d="M4 6l2.5 2L4 10M8 10.5h4" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  paint: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="#F472B6"/><circle cx="6" cy="6" r="1.3" fill="#fff"/><circle cx="10" cy="6" r="1.3" fill="#FDE047"/><circle cx="6.5" cy="10.2" r="1.3" fill="#60A5FA"/></svg>',
  calc: '<svg viewBox="0 0 16 16"><rect x="2.5" y="1.5" width="11" height="13" rx="2" fill="#475569"/><rect x="4.5" y="3.5" width="7" height="3" rx=".8" fill="#E2E8F0"/><path d="M5.2 9.2h.1M8 9.2h.1M10.8 9.2h.1M5.2 12h.1M8 12h.1M10.8 12h.1" stroke="#E2E8F0" stroke-width="1.6" stroke-linecap="round"/></svg>',
  gear: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="#64748B"/><circle cx="8" cy="8" r="2.4" fill="none" stroke="#fff" stroke-width="1.5"/></svg>',
  photo: '<svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="#0EA5E9"/><path d="M2 12l4-4 3 3 2-2 3 3" fill="#BAE6FD"/><circle cx="11" cy="5.5" r="1.3" fill="#FDE047"/></svg>',
  mail: '<svg viewBox="0 0 16 16"><rect x="1.5" y="3" width="13" height="10" rx="1.5" fill="#2563EB"/><path d="M2 4l6 5 6-5" fill="none" stroke="#fff" stroke-width="1.2"/></svg>' };
const TABS = [['notepad', 'notes.txt – Notepad'], ['folder', 'Downloads – File Explorer'], ['term', 'Windows PowerShell'], ['paint', 'sketch.png – Paint'],
  ['calc', 'Calculator'], ['gear', 'Settings'], ['photo', 'Photos'], ['mail', 'Inbox – Mail']];
const GICON = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#047857"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#g)"/><g fill="#fff" fill-opacity=".55"><path d="M28 21v-2.5a2.5 2.5 0 0 1 2.5-2.5h7a2.5 2.5 0 0 1 2.5 2.5V21z"/><path d="M44 21v-2.5a2.5 2.5 0 0 1 2.5-2.5h7a2.5 2.5 0 0 1 2.5 2.5V21z"/></g><path d="M8 19a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v5h29a3 3 0 0 1 3 3v22a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z" fill="#fff"/><rect x="12" y="28" width="40" height="4" rx="2" fill="#A7F3D0"/></svg>');
const idiv = (a, b) => Math.trunc(a / b);

function layoutTabs(barW, n, m) {
  const avail = Math.max(barW - m.spacing * (n - 1), 0);
  const w = Math.min(Math.max(idiv(avail, n), m.tab_min), m.tab_max);
  const top = m.top_gap, bottom = m.height, mid = idiv(top + bottom, 2);
  return Array.from({ length: n }, (_, i) => {
    const l = i * (w + m.spacing), r = l + w;
    const icon = { l: l + m.padding, t: mid - idiv(m.icon, 2) };
    const close = { l: r - m.padding - m.close, t: mid - idiv(m.close, 2) };
    return { l, r, t: top, b: bottom, icon, close, textL: icon.l + m.icon + idiv(m.padding, 2), textR: close.l - idiv(m.padding, 2) };
  });
}
function barHTML(m, barW, n, pal, cls = '') {
  const tabs = TABS.slice(0, n), g = layoutTabs(barW, n, m);
  const stripe = Math.max(idiv(m.height, 16), 2), r = m.corner / 2;
  let h = `<div class="bar ${cls}" style="width:${barW}px;height:${m.height}px">`;
  g.forEach((x, i) => {
    if (x.l >= barW) return; // tabs past the right edge are clipped
    const on = i === 0, w = Math.min(x.r, barW) - x.l, th = Math.max(0, x.b - x.t);
    h += `<div class="tb" style="left:${x.l}px;top:${x.t}px;width:${w}px;height:${th}px;border-radius:${r}px ${r}px 0 0;background:${on ? pal.active : pal.inactive};color:${pal.text}">`;
    if (on) h += `<i class="stripe" style="left:${m.corner / 2}px;right:${m.corner / 2}px;height:${stripe}px;background:${pal.accent}"></i>`;
    h += `<span class="ti" style="left:${x.icon.l - x.l}px;top:${x.icon.t - x.t}px;width:${m.icon}px;height:${m.icon}px">${IC[tabs[i][0]]}</span>`;
    if (x.textR - x.textL > 6) h += `<span class="tt" style="left:${x.textL - x.l}px;width:${x.textR - x.textL}px"><span>${tabs[i][1]}</span></span>`;
    if (on) h += `<span class="tx" style="left:${x.close.l - x.l}px;top:${x.close.t - x.t}px;width:${m.close}px;height:${m.close}px"><svg viewBox="0 0 4 4" style="width:50%;height:50%"><path d="M0 0l4 4M4 0L0 4" stroke="${pal.glyph}" stroke-width=".45"/></svg></span>`;
    h += '</div>';
  });
  return h + '</div>';
}
